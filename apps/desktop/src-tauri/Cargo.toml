[package]
name = "livariant-desktop"
version = "0.1.0-rc.12"
description = "Livariant Desktop Foundation"
authors = ["Livariant contributors"]
license = "SEE LICENSE IN ../../../LICENSE"
repository = "https://github.com/Kryt3r/livariant"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "livariant_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
