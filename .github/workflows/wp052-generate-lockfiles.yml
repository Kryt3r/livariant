name: WP-052 Generate Desktop Lockfiles

on:
  push:
    branches:
      - feat/wp052-deterministic-desktop-deps

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate npm lockfile
        working-directory: apps/desktop
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Generate Cargo lockfile
        working-directory: apps/desktop/src-tauri
        run: cargo generate-lockfile

      - name: Commit generated lockfiles to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git add apps/desktop/package-lock.json apps/desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfiles already current; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "WP-052: generate deterministic desktop lockfiles"
          git push origin HEAD:feat/wp052-deterministic-desktop-deps
