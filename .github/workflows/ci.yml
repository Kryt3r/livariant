name: Hardening CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hardening-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify CI risk
    runs-on: ubuntu-latest
    outputs:
      class: ${{ steps.classify.outputs.class }}
      run_executable: ${{ steps.classify.outputs.run_executable }}
      run_full: ${{ steps.classify.outputs.run_full }}
    steps:
      - name: Checkout full history for change classification
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test risk classifier
        run: node --test scripts/classify-ci-risk.test.mjs

      - name: Determine changed paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            : > changed-files.txt
          else
            git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
          fi
          echo "Changed paths:"
          cat changed-files.txt

      - name: Classify change risk
        id: classify
        shell: bash
        run: node scripts/classify-ci-risk.mjs < changed-files.txt >> "$GITHUB_OUTPUT"

      - name: Report classification
        shell: bash
        run: |
          echo "CI risk class: ${{ steps.classify.outputs.class }}"
          echo "Executable matrix required: ${{ steps.classify.outputs.run_executable }}"
          echo "Full hardening required: ${{ steps.classify.outputs.run_full }}"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Review introduced dependency risk
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  build-and-test:
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      # Keep these matrix check names during the ruleset migration so the
      # existing required checks continue to resolve safely.
      - name: Lightweight compatibility check
        if: needs.classify.outputs.run_executable != 'true' && matrix.os == 'windows-latest'
        shell: pwsh
        run: Write-Output "Class ${{ needs.classify.outputs.class }} does not require Windows executable hardening."

      - name: Checkout
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.run_executable == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.run_executable == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify public truth-surface consistency
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.run_full == 'true'
        run: node scripts/check-public-doc-consistency.mjs

      - name: Install locked dependencies
        if: needs.classify.outputs.run_executable == 'true'
        run: npm ci

      - name: Build TypeScript
        if: needs.classify.outputs.run_executable == 'true'
        run: npm run build

      - name: Run executable hardening tests
        if: needs.classify.outputs.run_executable == 'true'
        run: npm test

      - name: Pack, install, and execute clean-consumer smoke test
        if: needs.classify.outputs.run_full == 'true'
        run: npm run test:package

      - name: Build and verify manifest-bound release bundle
        if: needs.classify.outputs.run_full == 'true'
        run: npm run test:release-bundle

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - classify
      - dependency-review
      - build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI results
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          RISK_CLASS: ${{ needs.classify.outputs.class }}
        run: |
          echo "Risk class: ${RISK_CLASS:-unknown}"
          echo "Classifier result: $CLASSIFY_RESULT"
          echo "Dependency review result: $DEPENDENCY_REVIEW_RESULT"
          echo "Build/test result: $BUILD_RESULT"

          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "Risk classification did not succeed."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "pull_request" && "$DEPENDENCY_REVIEW_RESULT" != "success" ]]; then
            echo "Dependency Review did not succeed for this pull request."
            exit 1
          fi

          if [[ "$EVENT_NAME" != "pull_request" && "$DEPENDENCY_REVIEW_RESULT" != "skipped" ]]; then
            echo "Dependency Review produced an unexpected result outside pull_request context."
            exit 1
          fi

          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "Required verification for risk class $RISK_CLASS did not succeed."
            exit 1
          fi
