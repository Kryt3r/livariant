name: Hardening CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hardening-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify CI risk
    runs-on: ubuntu-latest
    outputs:
      class: ${{ steps.classify.outputs.class }}
      run_executable: ${{ steps.classify.outputs.run_executable }}
      run_full: ${{ steps.classify.outputs.run_full }}
    steps:
      - name: Checkout full history for change classification
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test risk classifier
        run: node --test scripts/classify-ci-risk.test.mjs

      - name: Determine changed paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            : > changed-files.txt
          else
            git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
          fi
          echo "Changed paths:"
          cat changed-files.txt

      - name: Classify change risk
        id: classify
        shell: bash
        run: node scripts/classify-ci-risk.mjs < changed-files.txt >> "$GITHUB_OUTPUT"

      - name: Report classification
        shell: bash
        run: |
          echo "CI risk class: ${{ steps.classify.outputs.class }}"
          echo "Executable matrix required: ${{ steps.classify.outputs.run_executable }}"
          echo "Full hardening required: ${{ steps.classify.outputs.run_full }}"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Review introduced dependency risk
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  build-and-test:
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Lightweight compatibility check
        if: needs.classify.outputs.run_executable != 'true' && matrix.os == 'windows-latest'
        shell: pwsh
        run: Write-Output "Class ${{ needs.classify.outputs.class }} does not require Windows executable hardening."

      - name: Checkout
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.run_executable == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.run_executable == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify public truth-surface consistency
        if: matrix.os == 'ubuntu-latest' || needs.classify.outputs.run_full == 'true'
        run: node scripts/check-public-doc-consistency.mjs

      - name: Install locked dependencies
        if: needs.classify.outputs.run_executable == 'true'
        run: npm ci

      - name: Build TypeScript
        if: needs.classify.outputs.run_executable == 'true'
        run: npm run build

      - name: Run executable hardening tests
        if: needs.classify.outputs.run_executable == 'true'
        run: npm test

      - name: Verify protected Guardian origin and consumed Semantic Authority on Linux
        if: needs.classify.outputs.run_full == 'true' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/livariant-guardian-fixture"
          rm -rf "$staging"
          mkdir -p "$staging"
          node scripts/build-guardian-protected-fixture.mjs "$staging"

          sudo rm -rf /var/lib/livariant-guardian
          sudo install -d -o root -g root -m 0755 \
            /var/lib/livariant-guardian \
            /var/lib/livariant-guardian/v1 \
            /var/lib/livariant-guardian/v1/records \
            /var/lib/livariant-guardian/v1/records/semantic-mutation
          sudo install -o root -g root -m 0555 "$staging/guardian-helper.js" /var/lib/livariant-guardian/v1/guardian-helper.js
          sudo install -o root -g root -m 0444 "$staging/guardian-root.json" /var/lib/livariant-guardian/v1/guardian-root.json
          sudo install -o root -g root -m 0444 \
            "$staging/records/semantic-mutation/44444444-4444-4444-8444-444444444444.json" \
            /var/lib/livariant-guardian/v1/records/semantic-mutation/44444444-4444-4444-8444-444444444444.json

          node scripts/guardian-protected-origin-smoke.mjs "$staging/fixture.json"
          node scripts/guardian-semantic-consumed-smoke.mjs

      - name: Clean protected Guardian fixture on Linux
        if: always() && needs.classify.outputs.run_full == 'true' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo rm -rf /var/lib/livariant-guardian
          rm -rf "$RUNNER_TEMP/livariant-guardian-fixture"

      - name: Verify protected Guardian origin and consumed Semantic Authority on Windows
        if: needs.classify.outputs.run_full == 'true' && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = Join-Path $env:RUNNER_TEMP 'livariant-guardian-fixture'
          $root = 'C:\ProgramData\Livariant\Guardian\v1'
          $livariant = 'C:\ProgramData\Livariant'
          $guardian = 'C:\ProgramData\Livariant\Guardian'
          $records = Join-Path $root 'records'
          $consumer = Join-Path $records 'semantic-mutation'
          Remove-Item -LiteralPath $staging -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          node scripts/build-guardian-protected-fixture.mjs $staging

          Remove-Item -LiteralPath $livariant -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $consumer -Force | Out-Null

          $system = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-18')
          $admins = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-544')
          $users = New-Object System.Security.Principal.SecurityIdentifier('S-1-5-32-545')
          $inherit = [System.Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit'
          $none = [System.Security.AccessControl.PropagationFlags]::None
          $allow = [System.Security.AccessControl.AccessControlType]::Allow

          function Set-ProtectedDirectory([string]$path) {
            $acl = New-Object System.Security.AccessControl.DirectorySecurity
            $acl.SetOwner($admins)
            $acl.SetAccessRuleProtection($true, $false)
            $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule($system, 'FullControl', $inherit, $none, $allow)))
            $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule($admins, 'FullControl', $inherit, $none, $allow)))
            $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule($users, 'ReadAndExecute', $inherit, $none, $allow)))
            [System.IO.Directory]::SetAccessControl($path, $acl)
          }

          function Set-ProtectedFile([string]$path) {
            $acl = New-Object System.Security.AccessControl.FileSecurity
            $acl.SetOwner($admins)
            $acl.SetAccessRuleProtection($true, $false)
            $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule($system, 'FullControl', $allow)))
            $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule($admins, 'FullControl', $allow)))
            $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule($users, 'ReadAndExecute', $allow)))
            [System.IO.File]::SetAccessControl($path, $acl)
          }

          foreach ($directory in @($livariant, $guardian, $root, $records, $consumer)) {
            Set-ProtectedDirectory $directory
          }

          Copy-Item -LiteralPath (Join-Path $staging 'guardian-helper.js') -Destination (Join-Path $root 'guardian-helper.js')
          Copy-Item -LiteralPath (Join-Path $staging 'guardian-root.json') -Destination (Join-Path $root 'guardian-root.json')
          Copy-Item -LiteralPath (Join-Path $staging 'records\semantic-mutation\44444444-4444-4444-8444-444444444444.json') -Destination (Join-Path $consumer '44444444-4444-4444-8444-444444444444.json')
          foreach ($file in @(
            (Join-Path $root 'guardian-helper.js'),
            (Join-Path $root 'guardian-root.json'),
            (Join-Path $consumer '44444444-4444-4444-8444-444444444444.json')
          )) {
            Set-ProtectedFile $file
          }

          node scripts/guardian-protected-origin-smoke.mjs (Join-Path $staging 'fixture.json')
          node scripts/guardian-semantic-consumed-smoke.mjs

      - name: Clean protected Guardian fixture on Windows
        if: always() && needs.classify.outputs.run_full == 'true' && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Remove-Item -LiteralPath 'C:\ProgramData\Livariant' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'livariant-guardian-fixture') -Recurse -Force -ErrorAction SilentlyContinue

      - name: Pack, install, and execute clean-consumer smoke test
        if: needs.classify.outputs.run_full == 'true'
        run: npm run test:package

      - name: Build and verify manifest-bound release bundle
        if: needs.classify.outputs.run_full == 'true'
        run: npm run test:release-bundle

      - name: Generate and verify release SBOM capability
        if: needs.classify.outputs.run_full == 'true' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          npm sbom --sbom-format spdx --sbom-type framework --omit=dev > release-sbom-smoke.spdx.json
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'));
          const sbom = JSON.parse(readFileSync('release-sbom-smoke.spdx.json', 'utf8'));
          if (sbom.spdxVersion !== 'SPDX-2.3') throw new Error(`Unexpected SBOM SPDX version: ${String(sbom.spdxVersion)}`);
          if (!Array.isArray(sbom.packages)) throw new Error('SBOM packages are missing.');
          const rootPackage = sbom.packages.find((entry) => entry?.name === packageJson.name && entry?.versionInfo === packageJson.version);
          if (!rootPackage) throw new Error('SBOM does not describe the expected Livariant package/version.');
          const releasePackageNames = new Set(sbom.packages.map((entry) => entry?.name).filter((name) => typeof name === 'string'));
          for (const devDependency of Object.keys(packageJson.devDependencies ?? {})) {
            if (releasePackageNames.has(devDependency)) throw new Error(`Release SBOM unexpectedly includes build-only devDependency: ${devDependency}`);
          }
          NODE

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - classify
      - dependency-review
      - build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI results
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          RISK_CLASS: ${{ needs.classify.outputs.class }}
        run: |
          echo "Risk class: ${RISK_CLASS:-unknown}"
          echo "Classifier result: $CLASSIFY_RESULT"
          echo "Dependency review result: $DEPENDENCY_REVIEW_RESULT"
          echo "Build/test result: $BUILD_RESULT"

          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "Risk classification did not succeed."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "pull_request" && "$DEPENDENCY_REVIEW_RESULT" != "success" ]]; then
            echo "Dependency Review did not succeed for this pull request."
            exit 1
          fi

          if [[ "$EVENT_NAME" != "pull_request" && "$DEPENDENCY_REVIEW_RESULT" != "skipped" ]]; then
            echo "Dependency Review produced an unexpected result outside pull_request context."
            exit 1
          fi

          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "Required verification for risk class $RISK_CLASS did not succeed."
            exit 1
          fi
