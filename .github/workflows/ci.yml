name: Hardening CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify public truth-surface consistency
        run: npm run test:public-docs

      - name: Build TypeScript
        run: npm run build

      - name: Run executable hardening tests
        run: npm test

      - name: Pack, install, and execute clean-consumer smoke test
        run: npm run test:package

      - name: Build and verify manifest-bound release bundle
        run: npm run test:release-bundle
