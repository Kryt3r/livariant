name: Desktop MutationObserver Performance Profile

on:
  pull_request:
    paths:
      - "scripts/desktop-mutation-observer-profile.mjs"
      - ".github/workflows/desktop-mutation-observer-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: windows-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install and build exact Desktop renderer
        working-directory: apps/desktop
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Profile MutationObserver callbacks across renderer navigation
        shell: pwsh
        run: |
          $preview = Start-Process -FilePath "npm.cmd" -ArgumentList @("run", "preview", "--", "--host", "127.0.0.1", "--port", "4173", "--strictPort") -WorkingDirectory (Join-Path $PWD "apps\desktop") -PassThru
          $browser = $null
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 100; $attempt += 1) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:4173" -UseBasicParsing -TimeoutSec 1
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 100
            }
            if (-not $ready) { throw "Desktop renderer preview did not become ready on port 4173." }

            $edge = @(
              (Join-Path ${env:ProgramFiles(x86)} "Microsoft\Edge\Application\msedge.exe"),
              (Join-Path $env:ProgramFiles "Microsoft\Edge\Application\msedge.exe")
            ) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
            if (-not $edge) { throw "Microsoft Edge executable not found on Windows runner." }

            $edgeProfile = Join-Path $env:RUNNER_TEMP "LivariantObserverChromiumProfile"
            Remove-Item -LiteralPath $edgeProfile -Recurse -Force -ErrorAction SilentlyContinue
            $browser = Start-Process -FilePath $edge -ArgumentList @(
              "--headless=new",
              "--disable-gpu",
              "--no-first-run",
              "--no-default-browser-check",
              "--remote-debugging-port=9222",
              "--user-data-dir=$edgeProfile",
              "about:blank"
            ) -PassThru

            node scripts/desktop-mutation-observer-profile.mjs "${{ github.event.pull_request.head.sha || github.sha }}" "desktop-mutation-observer-profile.json"
            if ($LASTEXITCODE -ne 0) { throw "MutationObserver profile helper failed with exit code $LASTEXITCODE." }

            $digest = (Get-FileHash -LiteralPath "desktop-mutation-observer-profile.json" -Algorithm SHA256).Hash.ToLowerInvariant()
            "sha256=$digest" | Set-Content -LiteralPath "desktop-mutation-observer-profile.sha256.txt" -Encoding utf8
            Write-Host "Desktop renderer MutationObserver profile SHA-256: $digest"
          }
          finally {
            if ($browser -and -not $browser.HasExited) { Stop-Process -Id $browser.Id -Force -ErrorAction SilentlyContinue }
            Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            if ($preview -and -not $preview.HasExited) { Stop-Process -Id $preview.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload MutationObserver performance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-mutation-observer-profile-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            desktop-mutation-observer-profile.json
            desktop-mutation-observer-profile.sha256.txt
          if-no-files-found: error
