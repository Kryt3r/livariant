name: Desktop Windows Foundation
# WP-050: exact-head cache qualification retrigger; no semantic change.

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-windows-foundation.yml"
      - ".github/workflows/ci-verification-mode.yml"
      - "scripts/classify-ci-risk.mjs"
      - "scripts/classify-ci-risk.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mode:
    uses: ./.github/workflows/ci-verification-mode.yml

  build:
    name: Build Tauri foundation on Windows
    needs: mode
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Report Windows toolchain
        id: toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          $rustCommit = ((rustc -Vv | Select-String '^commit-hash:' | ForEach-Object { ($_ -split ':', 2)[1].Trim() }))
          if (-not $rustCommit) {
            throw "Could not resolve rustc commit hash for cache identity."
          }
          "rust_commit=$rustCommit" >> $env:GITHUB_OUTPUT
          Write-Host "Risk class: ${{ needs.mode.outputs.risk_class }}"
          Write-Host "Full qualification now: ${{ needs.mode.outputs.run_full }}"

      - name: Restore exact Windows Cargo cache
        id: cargo-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          key: windows-cargo-${{ steps.toolchain.outputs.rust_commit }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') }}

      - name: Report Cargo cache result
        shell: pwsh
        run: Write-Host "Cargo cache hit: ${{ steps.cargo-cache.outputs.cache-hit }}"

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Build renderer
        run: npm run build

      - name: Check Rust host
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Fast Draft checkpoint
        if: needs.mode.outputs.run_full != 'true'
        shell: pwsh
        run: Write-Host "Fast Desktop CI passed renderer build + Rust host check; native executable build and launch smoke are deferred until qualification."

      - name: Generate Livariant NSIS branding
        if: needs.mode.outputs.run_full == 'true'
        shell: pwsh
        run: ./src-tauri/windows/generate-installer-branding.ps1

      - name: Build Windows desktop executable without installer bundling
        if: needs.mode.outputs.run_full == 'true'
        run: npm run tauri:build -- --no-bundle --ci

      - name: Smoke native Windows app launch
        if: needs.mode.outputs.run_full == 'true'
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "src-tauri\target\release\livariant-desktop.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Expected desktop executable not found: $exe"
          }

          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8

          if ($process.HasExited) {
            throw "Livariant Desktop exited during launch smoke with code $($process.ExitCode)."
          }

          Stop-Process -Id $process.Id -Force
          $process.WaitForExit()
          Write-Host "Livariant Desktop stayed alive through the Windows launch smoke."
