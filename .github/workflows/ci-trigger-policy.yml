name: CI Trigger Policy

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-trigger-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trigger-policy:
    name: Prevent duplicate Ready qualification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enforce CI trigger policy
        run: node scripts/check-ci-trigger-policy.mjs
