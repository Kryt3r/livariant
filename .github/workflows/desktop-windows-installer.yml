name: Desktop Windows Installer

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Build branded NSIS installer on Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Report Windows toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Build branded NSIS installer
        run: npm run tauri:build -- --bundles nsis --ci

      - name: Verify installer artifact and record digest
        id: installer
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "src-tauri\target\release\bundle\nsis"
          $installers = @(Get-ChildItem -LiteralPath $bundle -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer in $bundle; found $($installers.Count)."
          }

          $installer = $installers[0]
          $digest = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Installer: $($installer.Name)"
          Write-Host "SHA256: $digest"
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          "sha256=$digest" >> $env:GITHUB_OUTPUT

      - name: Upload exact installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: livariant-windows-nsis-${{ github.sha }}
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 7
