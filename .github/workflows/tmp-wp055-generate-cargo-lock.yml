name: Temporary WP-055 Cargo Lock Generation

on:
  push:
    branches:
      - feat/wp055-operator-broadcast-signature-verifier
    paths:
      - .github/workflows/tmp-wp055-generate-cargo-lock.yml

permissions:
  contents: write

jobs:
  generate-lock-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Generate Cargo lockfile from manifest
        working-directory: apps/desktop/src-tauri
        run: cargo metadata --format-version 1 > /dev/null

      - name: Verify minisign verifier remains exactly 0.2.5
        working-directory: apps/desktop/src-tauri
        run: |
          grep -A3 'name = "minisign-verify"' Cargo.lock
          test "$(grep -A3 'name = "minisign-verify"' Cargo.lock | grep 'version = "0.2.5"' | wc -l)" -eq 1

      - name: Commit generated lockfile and remove temporary workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git rm .github/workflows/tmp-wp055-generate-cargo-lock.yml
          git add apps/desktop/src-tauri/Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate Cargo lockfile for operator broadcast verifier'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
