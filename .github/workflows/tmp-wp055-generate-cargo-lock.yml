name: Temporary WP-055 Cargo Lock Generation

on:
  push:
    branches:
      - feat/wp055-operator-broadcast-signature-verifier
    paths:
      - .github/workflows/tmp-wp055-generate-cargo-lock.yml
      - apps/desktop/src-tauri/Cargo.toml

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Generate Cargo lockfile from manifest
        working-directory: apps/desktop/src-tauri
        run: cargo metadata --format-version 1 > /dev/null

      - name: Verify minisign verifier remains exactly 0.2.5
        working-directory: apps/desktop/src-tauri
        run: |
          grep -A3 'name = "minisign-verify"' Cargo.lock
          test "$(grep -A3 'name = "minisign-verify"' Cargo.lock | grep 'version = "0.2.5"' | wc -l)" -eq 1

      - name: Upload Cargo-generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp055-generated-cargo-lock
          path: apps/desktop/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1
