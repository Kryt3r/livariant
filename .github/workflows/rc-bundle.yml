name: Build RC Bundle

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-rc-bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$SOURCE_SHA"
          printf '%s\n' "$observed" > RC-SOURCE-COMMIT

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source candidate before packaging
        shell: bash
        run: |
          set -euo pipefail
          npm run test:public-docs
          npm run build
          npm test
          npm run test:package
          npm run test:release-bundle

      - name: Build RC bundle
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-release-bundle.mjs \
            --source-id github:Kryt3r/livariant \
            --channel preview \
            --schema 1 \
            --compatible-from 0.1.0-rc.1,0.1.0-rc.2,0.1.0-rc.3 \
            --output rc-bundle

      - name: Generate exact-source Q-07 context and token evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LIVARIANT_BENCHMARK_SOURCE_SHA="$SOURCE_SHA" node scripts/token-efficiency-baseline.mjs > rc-bundle/context-token-evidence.json
          LIVARIANT_BENCHMARK_SOURCE_SHA="$SOURCE_SHA" node scripts/verification-trace-token-benchmark.mjs > rc-bundle/verification-trace-token-evidence.json
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          const sourceSha = process.env.SOURCE_SHA;
          const context = JSON.parse(readFileSync('rc-bundle/context-token-evidence.json', 'utf8'));
          const trace = JSON.parse(readFileSync('rc-bundle/verification-trace-token-evidence.json', 'utf8'));

          if (context.sourceIdentity?.sourceSha !== sourceSha || context.sourceIdentity?.exactSourceBound !== true) {
            throw new Error('Context/token benchmark is not bound to exact RC source SHA.');
          }
          if (trace.sourceIdentity?.sourceSha !== sourceSha || trace.sourceIdentity?.exactSourceBound !== true) {
            throw new Error('Verification Trace benchmark is not bound to exact RC source SHA.');
          }
          if (context.reliabilityAssertions?.mcpReturnedWithoutMutationAuthority !== true || context.reliabilityAssertions?.changesMade !== 0) {
            throw new Error('Context benchmark lost read-only / mutation-Authority boundary.');
          }
          if (trace.reliabilityAssertions?.assessmentStatesPreserved !== true || trace.reliabilityAssertions?.sourceReferencesPreserved !== true) {
            throw new Error('Verification Trace compact projection lost reliability-critical information.');
          }
          if (!String(context.methodology?.tokenProxy ?? '').toLowerCase().includes('proxy')) {
            throw new Error('Context benchmark does not identify its token method as a proxy.');
          }
          if (!String(trace.methodology?.tokenProxy ?? '').toLowerCase().includes('proxy')) {
            throw new Error('Verification Trace benchmark does not identify its token method as a proxy.');
          }

          const summary = {
            schemaVersion: 1,
            sourceSha,
            methodology: {
              tokenProxy: 'ceil(utf8-bytes/4)',
              exactProviderBillingTokens: false,
              boundary: 'Deterministic reproducible payload proxy only. Provider/client projection and billed tokens may differ.',
            },
            measurements: {
              mcpTransportTokenProxy: Math.ceil(context.mcpDelivery.transportResponseBytes / 4),
              mcpExplicitTextTokenProxy: context.mcpDelivery.explicitTextContentTokenProxy,
              mcpStructuredContentTokenProxy: Math.ceil(context.mcpDelivery.structuredContentBytes / 4),
              measuredContextSurfaceAggregateTokenProxy: context.aggregateDiagnostics.tokenProxyAcrossMeasuredSurfaces,
              verificationRawTraceTokenProxy: trace.measurements.rawTraceInput.tokenProxy,
              verificationFullAssessmentTokenProxy: trace.measurements.fullAssessment.tokenProxy,
              verificationCompactTokenProxy: trace.measurements.compactConsumerProjection.tokenProxy,
              verificationCompactReductionRatio: trace.compactProjectionReductionVsFullAssessment.ratio,
            },
            reliabilityAssertions: {
              contextWithoutMutationAuthority: context.reliabilityAssertions.mcpReturnedWithoutMutationAuthority === true && context.reliabilityAssertions.changesMade === 0,
              verificationStatesPreserved: trace.reliabilityAssertions.assessmentStatesPreserved === true,
              verificationSourceReferencesPreserved: trace.reliabilityAssertions.sourceReferencesPreserved === true,
              verificationGrantsAuthority: trace.reliabilityAssertions.grantsAuthority,
            },
            limitations: [
              'Not exact Claude, Codex, or other provider billing tokens.',
              'Does not prove universal token savings versus working without Livariant.',
              'Does not measure Stable-level real-agent tool-selection reliability.',
            ],
          };
          writeFileSync('rc-bundle/Q07-TOKEN-EVIDENCE.json', `${JSON.stringify(summary, null, 2)}\n`);
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Generate exact-source SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          npm sbom --sbom-format spdx --sbom-type framework --omit=dev > rc-bundle/release-sbom.spdx.json

      - name: Independently verify bundle identity, SBOM, and digests
        id: verify
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync, readdirSync, writeFileSync, appendFileSync } = require('node:fs');
          const path = require('node:path');

          const sourceSha = process.env.SOURCE_SHA;
          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'));
          if (packageJson.name !== 'livariant') throw new Error('Unexpected package name.');
          const expectedVersion = packageJson.version;
          if (typeof expectedVersion !== 'string' || !/^0\.1\.0-rc\.\d+$/.test(expectedVersion)) {
            throw new Error(`Unexpected RC package version: ${String(expectedVersion)}`);
          }

          const dir = 'rc-bundle';
          const tarballs = readdirSync(dir).filter((name) => name.endsWith('.tgz'));
          if (tarballs.length !== 1) throw new Error(`Expected exactly one tarball, observed ${tarballs.length}.`);

          const artifact = tarballs[0];
          const bytes = readFileSync(path.join(dir, artifact));
          const sha256 = createHash('sha256').update(bytes).digest('hex');
          const manifest = JSON.parse(readFileSync(path.join(dir, 'release-manifest.json'), 'utf8'));
          const release = manifest?.[0];
          if (!release) throw new Error('Missing release descriptor.');
          if (release.version !== expectedVersion) throw new Error('Manifest version mismatch.');
          if (release.channel !== 'preview') throw new Error('Manifest channel mismatch.');
          if (release.projectBrainSchema !== 1) throw new Error('Manifest Project Brain schema mismatch.');
          if (release.sourceId !== 'github:Kryt3r/livariant') throw new Error('Manifest sourceId mismatch.');
          for (const predecessor of ['0.1.0-rc.1', '0.1.0-rc.2', '0.1.0-rc.3']) {
            if (!release.compatibility?.from?.includes(predecessor)) {
              throw new Error(`Manifest missing ${predecessor} compatibility.`);
            }
          }
          if (release.artifact?.id !== 'runtime-node-cli') throw new Error('Manifest artifact id mismatch.');
          if (release.artifact?.sha256 !== sha256) throw new Error('Manifest SHA-256 does not match artifact bytes.');

          const sums = readFileSync(path.join(dir, 'SHA256SUMS'), 'utf8');
          if (sums !== `${sha256}  ${artifact}\n`) throw new Error('SHA256SUMS mismatch.');

          const sbomFile = 'release-sbom.spdx.json';
          const sbomBytes = readFileSync(path.join(dir, sbomFile));
          const sbomSha256 = createHash('sha256').update(sbomBytes).digest('hex');
          const sbom = JSON.parse(sbomBytes.toString('utf8'));
          if (sbom.spdxVersion !== 'SPDX-2.3') throw new Error(`Unexpected SBOM SPDX version: ${String(sbom.spdxVersion)}`);
          if (!Array.isArray(sbom.packages)) throw new Error('SBOM packages are missing.');
          const rootPackage = sbom.packages.find((entry) => entry?.name === packageJson.name && entry?.versionInfo === expectedVersion);
          if (!rootPackage) throw new Error('SBOM does not describe the expected Livariant package/version.');
          const releasePackageNames = new Set(sbom.packages.map((entry) => entry?.name).filter((name) => typeof name === 'string'));
          for (const devDependency of Object.keys(packageJson.devDependencies ?? {})) {
            if (releasePackageNames.has(devDependency)) throw new Error(`Release SBOM unexpectedly includes build-only devDependency: ${devDependency}`);
          }

          writeFileSync(
            path.join(dir, 'RC-BUILD-METADATA.json'),
            `${JSON.stringify({
              sourceSha,
              version: release.version,
              channel: release.channel,
              sourceId: release.sourceId,
              artifact,
              sha256,
              sbom: {
                file: sbomFile,
                format: 'SPDX-2.3',
                sha256: sbomSha256,
                excludesDevDependencies: true,
              },
            }, null, 2)}\n`,
          );
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${release.version}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${sha256}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `sbom_sha256=${sbomSha256}\n`);
          console.log(JSON.stringify({ sourceSha, version: release.version, artifact, sha256, sbomFile, sbomSha256 }, null, 2));
          NODE
          cp RC-SOURCE-COMMIT rc-bundle/RC-SOURCE-COMMIT

      - name: Collect exact-source release decision evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/collect-release-decision-evidence.mjs \
            rc-bundle/RC-BUILD-METADATA.json \
            rc-bundle/release-decision-evidence.json

      - name: Build release decision dossier
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-release-decision-dossier.mjs \
            --input rc-bundle/release-decision-evidence.json \
            --output-dir rc-bundle

      - name: Bind dossier identity into RC metadata
        id: dossier
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync, writeFileSync, appendFileSync } = require('node:fs');
          const path = require('node:path');
          const dir = 'rc-bundle';
          const metadataPath = path.join(dir, 'RC-BUILD-METADATA.json');
          const metadata = JSON.parse(readFileSync(metadataPath, 'utf8'));
          const jsonFile = 'release-decision-dossier.json';
          const markdownFile = 'release-decision-dossier.md';
          const jsonBytes = readFileSync(path.join(dir, jsonFile));
          const markdownBytes = readFileSync(path.join(dir, markdownFile));
          const dossier = JSON.parse(jsonBytes.toString('utf8'));
          const jsonSha256 = createHash('sha256').update(jsonBytes).digest('hex');
          const markdownSha256 = createHash('sha256').update(markdownBytes).digest('hex');
          metadata.releaseDecisionDossier = {
            recommendation: dossier.recommendation,
            jsonFile,
            jsonSha256,
            markdownFile,
            markdownSha256,
            authority: false,
          };
          writeFileSync(metadataPath, `${JSON.stringify(metadata, null, 2)}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `recommendation=${dossier.recommendation}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `json_sha256=${jsonSha256}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `markdown_sha256=${markdownSha256}\n`);
          NODE

      - name: Upload verified RC bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: livariant-${{ steps.verify.outputs.version }}-${{ github.sha }}-${{ steps.verify.outputs.sha256 }}
          path: rc-bundle/
          if-no-files-found: error
          retention-days: 7

      - name: Record artifact and decision identity
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ steps.verify.outputs.version }}
          SHA256: ${{ steps.verify.outputs.sha256 }}
          SBOM_SHA256: ${{ steps.verify.outputs.sbom_sha256 }}
          RECOMMENDATION: ${{ steps.dossier.outputs.recommendation }}
          DOSSIER_JSON_SHA256: ${{ steps.dossier.outputs.json_sha256 }}
          DOSSIER_MARKDOWN_SHA256: ${{ steps.dossier.outputs.markdown_sha256 }}
        run: |
          set -euo pipefail
          echo "Verified RC version: $VERSION"
          echo "Verified RC source: $SOURCE_SHA"
          echo "Verified RC artifact SHA-256: $SHA256"
          echo "Verified RC SBOM SHA-256: $SBOM_SHA256"
          echo "Release decision recommendation: $RECOMMENDATION"
          echo "Dossier JSON SHA-256: $DOSSIER_JSON_SHA256"
          echo "Dossier Markdown SHA-256: $DOSSIER_MARKDOWN_SHA256"
          echo "Artifact name: livariant-$VERSION-$SOURCE_SHA-$SHA256"

      - name: Enforce fail-closed RC qualification
        shell: bash
        env:
          RECOMMENDATION: ${{ steps.dossier.outputs.recommendation }}
        run: |
          set -euo pipefail
          if [[ "$RECOMMENDATION" == "NO-GO" ]]; then
            echo "Release Decision Dossier is NO-GO. Evidence artifact was preserved, but RC qualification fails closed."
            exit 1
          fi
          echo "Release Decision Dossier recommendation: $RECOMMENDATION"
          echo "This is evidence only and does not authorize publication."
