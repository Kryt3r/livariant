name: Build RC Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rc-bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$SOURCE_SHA"
          printf '%s\n' "$observed" > RC-SOURCE-COMMIT

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source candidate before packaging
        shell: bash
        run: |
          set -euo pipefail
          npm run test:public-docs
          npm run build
          npm test
          npm run test:package
          npm run test:release-bundle

      - name: Build RC bundle
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-release-bundle.mjs \
            --source-id github:Kryt3r/livariant \
            --channel preview \
            --schema 1 \
            --compatible-from 0.1.0-rc.1,0.1.0-rc.2 \
            --output rc-bundle

      - name: Independently verify bundle identity and digest
        id: verify
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync, readdirSync, writeFileSync, appendFileSync } = require('node:fs');
          const path = require('node:path');

          const sourceSha = process.env.SOURCE_SHA;
          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'));
          if (packageJson.name !== 'livariant') throw new Error('Unexpected package name.');
          const expectedVersion = packageJson.version;
          if (typeof expectedVersion !== 'string' || !/^0\.1\.0-rc\.\d+$/.test(expectedVersion)) {
            throw new Error(`Unexpected RC package version: ${String(expectedVersion)}`);
          }

          const dir = 'rc-bundle';
          const tarballs = readdirSync(dir).filter((name) => name.endsWith('.tgz'));
          if (tarballs.length !== 1) throw new Error(`Expected exactly one tarball, observed ${tarballs.length}.`);

          const artifact = tarballs[0];
          const bytes = readFileSync(path.join(dir, artifact));
          const sha256 = createHash('sha256').update(bytes).digest('hex');
          const manifest = JSON.parse(readFileSync(path.join(dir, 'release-manifest.json'), 'utf8'));
          const release = manifest?.[0];
          if (!release) throw new Error('Missing release descriptor.');
          if (release.version !== expectedVersion) throw new Error('Manifest version mismatch.');
          if (release.channel !== 'preview') throw new Error('Manifest channel mismatch.');
          if (release.projectBrainSchema !== 1) throw new Error('Manifest Project Brain schema mismatch.');
          if (release.sourceId !== 'github:Kryt3r/livariant') throw new Error('Manifest sourceId mismatch.');
          if (!release.compatibility?.from?.includes('0.1.0-rc.1')) throw new Error('Manifest missing rc.1 compatibility.');
          if (!release.compatibility?.from?.includes('0.1.0-rc.2')) throw new Error('Manifest missing rc.2 compatibility.');
          if (release.artifact?.id !== 'runtime-node-cli') throw new Error('Manifest artifact id mismatch.');
          if (release.artifact?.sha256 !== sha256) throw new Error('Manifest SHA-256 does not match artifact bytes.');

          const sums = readFileSync(path.join(dir, 'SHA256SUMS'), 'utf8');
          if (sums !== `${sha256}  ${artifact}\n`) throw new Error('SHA256SUMS mismatch.');

          writeFileSync(
            path.join(dir, 'RC-BUILD-METADATA.json'),
            `${JSON.stringify({ sourceSha, version: release.version, channel: release.channel, sourceId: release.sourceId, artifact, sha256 }, null, 2)}\n`,
          );
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${release.version}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${sha256}\n`);
          console.log(JSON.stringify({ sourceSha, version: release.version, artifact, sha256 }, null, 2));
          NODE
          cp RC-SOURCE-COMMIT rc-bundle/RC-SOURCE-COMMIT

      - name: Upload verified RC bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: livariant-${{ steps.verify.outputs.version }}-${{ github.sha }}-${{ steps.verify.outputs.sha256 }}
          path: rc-bundle/
          if-no-files-found: error
          retention-days: 7

      - name: Record artifact identity
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ steps.verify.outputs.version }}
          SHA256: ${{ steps.verify.outputs.sha256 }}
        run: |
          set -euo pipefail
          echo "Verified RC version: $VERSION"
          echo "Verified RC source: $SOURCE_SHA"
          echo "Verified RC artifact SHA-256: $SHA256"
          echo "Artifact name: livariant-$VERSION-$SOURCE_SHA-$SHA256"
