name: WP-056 Polish Installer QA Dispatch

on:
  push:
    branches:
      - wp-056-redesign-polish-pass
    paths:
      - "apps/desktop/**"
      - ".github/workflows/wp056-polish-installer-dispatch.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing Windows installer workflow for this exact branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: gh api --method POST "repos/${{ github.repository }}/actions/workflows/desktop-windows-installer.yml/dispatches" -f ref="$BRANCH"
