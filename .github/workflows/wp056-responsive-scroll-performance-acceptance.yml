name: WP-056 Responsive Scroll Performance Acceptance

on:
  push:
    branches:
      - wp-056-responsive-scroll-performance-acceptance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install Core dependencies
        run: npm ci

      - name: Build Core
        run: npm run build

      - name: Install Desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Install Playwright test runner
        working-directory: apps/desktop
        run: npm install --no-save --ignore-scripts @playwright/test@1.55.0

      - name: Type-check and build Desktop
        working-directory: apps/desktop
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium

      - name: Start Visual-QA renderer
        working-directory: apps/desktop
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/livariant-responsive-acceptance.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:1420/visual-preview.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/livariant-responsive-acceptance.log
          exit 1

      - name: Run responsive, scroll and remount acceptance
        working-directory: apps/desktop
        run: npx playwright test tests/wp056-responsive-acceptance.spec.ts --reporter=line --workers=1

      - name: Capture acceptance screenshots
        working-directory: apps/desktop
        run: |
          mkdir -p responsive-acceptance-output
          timeout 45s npx playwright screenshot --browser=chromium --viewport-size="1366,768" --wait-for-timeout=1600 "http://127.0.0.1:1420/visual-preview.html?lang=de&view=overview" responsive-acceptance-output/overview-1366x768.png
          timeout 45s npx playwright screenshot --browser=chromium --viewport-size="1024,720" --wait-for-timeout=1800 "http://127.0.0.1:1420/visual-preview.html?lang=de&view=steps" responsive-acceptance-output/project-brain-1024x720.png
          timeout 45s npx playwright screenshot --browser=chromium --viewport-size="1024,720" --wait-for-timeout=2200 "http://127.0.0.1:1420/visual-preview.html?lang=de&view=diagnostics" responsive-acceptance-output/diagnostics-1024x720.png
          timeout 45s npx playwright screenshot --browser=chromium --viewport-size="900,700" --wait-for-timeout=1800 "http://127.0.0.1:1420/visual-preview.html?lang=de&view=settings&section=updates" responsive-acceptance-output/settings-900x700.png
          timeout 45s npx playwright screenshot --browser=chromium --viewport-size="1024,720" --wait-for-timeout=2200 "http://127.0.0.1:1420/visual-preview.html?lang=de&view=source-review&section=sources" responsive-acceptance-output/source-review-1024x720.png

      - name: Upload acceptance screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp056-responsive-scroll-performance-acceptance
          path: apps/desktop/responsive-acceptance-output/*.png
          if-no-files-found: error
          retention-days: 7
