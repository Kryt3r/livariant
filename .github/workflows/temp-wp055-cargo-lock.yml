name: Temporary WP-055 Cargo lock generation

on:
  push:
    branches:
      - feat/wp055-bounded-http-client
    paths:
      - ".github/workflows/temp-wp055-cargo-lock.yml"

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/wp055-bounded-http-client

      - name: Resolve Cargo metadata
        run: cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null

      - name: Verify exact ureq resolution
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          lock = pathlib.Path('apps/desktop/src-tauri/Cargo.lock').read_text(encoding='utf-8')
          block = 'name = "ureq"\nversion = "2.12.1"'
          if block not in lock:
              raise SystemExit('Cargo.lock does not contain exact ureq 2.12.1')
          PY

      - name: Commit generated lockfile and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.lock
          git rm .github/workflows/temp-wp055-cargo-lock.yml
          git commit -m "WP-055: generate bounded HTTP client lock metadata"
          git push origin HEAD:feat/wp055-bounded-http-client
