name: Desktop Startup and Disconnected Idle Baseline

on:
  pull_request:
    paths:
      - "scripts/desktop-process-window-baseline.ps1"
      - ".github/workflows/desktop-process-window-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-and-idle:
    runs-on: windows-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build Livariant Core from lockfile
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Stage pinned Node runtime and exact Core resources
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne "X64") {
            throw "WP-052 installed Desktop baseline currently supports the x64 Windows runtime bundle only; runner architecture is $env:RUNNER_ARCH."
          }

          $sourceSha = "${{ github.event.pull_request.head.sha || github.sha }}"
          $nodeVersion = "24.16.0"
          $nodeArchiveName = "node-v$nodeVersion-win-x64.zip"
          $nodeArchiveSha256 = "edaca9bd58ec8e92037dac4e877d52f6b8f430b81c18b57e264b4e2fb111cd56"
          $nodeExeSha256 = "b3094d0b49f9ad602262a9921551737bb97637c05dd357a06ae98188d7290aa3"
          $nodeUrl = "https://nodejs.org/download/release/v$nodeVersion/$nodeArchiveName"
          $download = Join-Path $env:RUNNER_TEMP $nodeArchiveName
          $extract = Join-Path $env:RUNNER_TEMP "livariant-node-runtime"
          $tauriRoot = Join-Path $PWD "apps\desktop\src-tauri"
          $binaryDir = Join-Path $tauriRoot "binaries"
          $runtimeDir = Join-Path $tauriRoot "runtime"
          $coreDir = Join-Path $runtimeDir "core"
          $coreDistDir = Join-Path $coreDir "dist"
          $thirdPartyDir = Join-Path $runtimeDir "third-party"

          Remove-Item -LiteralPath $binaryDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $runtimeDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $binaryDir, $coreDistDir, $thirdPartyDir -Force | Out-Null

          Invoke-WebRequest -Uri $nodeUrl -OutFile $download
          $archiveDigest = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveDigest -ne $nodeArchiveSha256) {
            throw "Pinned Node archive digest mismatch. Expected $nodeArchiveSha256, got $archiveDigest."
          }

          Expand-Archive -LiteralPath $download -DestinationPath $extract -Force
          $nodeRoot = Join-Path $extract "node-v$nodeVersion-win-x64"
          $nodeExe = Join-Path $nodeRoot "node.exe"
          $nodeLicense = Join-Path $nodeRoot "LICENSE"
          $exeDigest = (Get-FileHash -LiteralPath $nodeExe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($exeDigest -ne $nodeExeSha256) {
            throw "Pinned Node executable digest mismatch. Expected $nodeExeSha256, got $exeDigest."
          }

          Copy-Item -LiteralPath $nodeExe -Destination (Join-Path $binaryDir "livariant-node-x86_64-pc-windows-msvc.exe")
          Copy-Item -LiteralPath $nodeLicense -Destination (Join-Path $thirdPartyDir "NODE-LICENSE.txt")
          Copy-Item -LiteralPath "dist\src" -Destination (Join-Path $coreDistDir "src") -Recurse

          $rootPackage = Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json
          @{
            name = "livariant-bundled-core"
            version = $rootPackage.version
            private = $true
            type = "module"
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $coreDir "package.json") -Encoding utf8

          [ordered]@{
            schemaVersion = 1
            coreVersion = $rootPackage.version
            coreSourceSha = $sourceSha
            nodeVersion = $nodeVersion
            nodeArchive = $nodeArchiveName
            nodeArchiveSha256 = $nodeArchiveSha256
            nodeExecutableSha256 = $nodeExeSha256
            authorityIssued = $false
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $runtimeDir "manifest.json") -Encoding utf8

      - name: Install Desktop dependencies from lockfile
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: Generate installer branding
        working-directory: apps/desktop
        shell: pwsh
        run: ./src-tauri/windows/generate-installer-branding.ps1

      - name: Build installed-runtime NSIS candidate with locked Rust dependencies
        working-directory: apps/desktop
        run: npm run tauri:build -- --config src-tauri/tauri.runtime.conf.json --bundles nsis --ci -- --locked

      - name: Install candidate and capture startup plus disconnected-idle evidence
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "apps\desktop\src-tauri\target\release\bundle\nsis"
          $installers = @(Get-ChildItem -LiteralPath $bundle -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer in $bundle; found $($installers.Count)."
          }

          $installDir = Join-Path $env:RUNNER_TEMP "LivariantStartupIdleBaseline"
          Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
          $install = Start-Process -FilePath $installers[0].FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Silent NSIS install failed with exit code $($install.ExitCode)."
          }

          $app = Join-Path $installDir "livariant-desktop.exe"
          $node = Join-Path $installDir "livariant-node.exe"
          $manifest = Join-Path $installDir "runtime\manifest.json"
          $core = Join-Path $installDir "runtime\core\dist\src\cli\index.js"
          foreach ($required in @($app, $node, $manifest, $core)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Required installed runtime material not found: $required"
            }
          }

          ./scripts/desktop-process-window-baseline.ps1 `
            -AppPath $app `
            -SourceSha "${{ github.event.pull_request.head.sha || github.sha }}" `
            -OutputPath "desktop-startup-idle-baseline.json"

          $digest = (Get-FileHash -LiteralPath "desktop-startup-idle-baseline.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$digest" | Set-Content -LiteralPath "desktop-startup-idle-baseline.sha256.txt" -Encoding utf8
          Write-Host "Desktop startup/disconnected-idle baseline SHA-256: $digest"

          "LIVARIANT_BENCH_INSTALL_DIR=$installDir" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "LIVARIANT_BENCH_APP=$app" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Profile MutationObserver callbacks across real Desktop navigation
        shell: pwsh
        run: |
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9222"
          $profileScript = Join-Path $env:RUNNER_TEMP "livariant-mutation-observer-profile.mjs"
          @'
          import { writeFile } from "node:fs/promises";

          const sourceSha = process.argv[2];
          const outputPath = process.argv[3];
          if (!/^[0-9a-f]{40}$/i.test(sourceSha)) throw new Error("Exact source SHA is required.");
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          let target;
          for (let attempt = 0; attempt < 150; attempt += 1) {
            try {
              const response = await fetch("http://127.0.0.1:9222/json");
              const targets = await response.json();
              target = targets.find((entry) => entry.type === "page" && entry.webSocketDebuggerUrl);
            } catch {}
            if (target) break;
            await sleep(100);
          }
          if (!target) throw new Error("WebView2 DevTools target did not appear on port 9222.");

          const socket = new WebSocket(target.webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            socket.addEventListener("open", resolve, { once: true });
            socket.addEventListener("error", reject, { once: true });
          });

          let nextId = 1;
          const pending = new Map();
          socket.addEventListener("message", (event) => {
            const message = JSON.parse(String(event.data));
            if (!message.id) return;
            const waiter = pending.get(message.id);
            if (!waiter) return;
            pending.delete(message.id);
            if (message.error) waiter.reject(new Error(JSON.stringify(message.error)));
            else waiter.resolve(message.result);
          });
          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const id = nextId++;
            pending.set(id, { resolve, reject });
            socket.send(JSON.stringify({ id, method, params }));
          });

          await send("Page.enable");
          await send("Runtime.enable");
          const instrumentation = `(() => {
            const NativeMutationObserver = window.MutationObserver;
            const aggregate = { created: 0, callbacks: 0, records: 0, totalMs: 0, maxMs: 0, observers: [] };
            window.__livariantMutationObserverStats = aggregate;
            window.MutationObserver = class LivariantProfiledMutationObserver extends NativeMutationObserver {
              constructor(callback) {
                const stack = String(new Error().stack || "").split("\\n").find((line) => line.includes("/assets/")) || "unknown";
                const originMatch = stack.match(/assets\\/[^\\s)]+/);
                const entry = { id: aggregate.created + 1, origin: originMatch ? originMatch[0] : "unknown", callbacks: 0, records: 0, totalMs: 0, maxMs: 0 };
                aggregate.created += 1;
                aggregate.observers.push(entry);
                super((records, observer) => {
                  const started = performance.now();
                  try { return callback(records, observer); }
                  finally {
                    const elapsed = performance.now() - started;
                    entry.callbacks += 1;
                    entry.records += records.length;
                    entry.totalMs += elapsed;
                    entry.maxMs = Math.max(entry.maxMs, elapsed);
                    aggregate.callbacks += 1;
                    aggregate.records += records.length;
                    aggregate.totalMs += elapsed;
                    aggregate.maxMs = Math.max(aggregate.maxMs, elapsed);
                  }
                });
              }
            };
          })();`;
          await send("Page.addScriptToEvaluateOnNewDocument", { source: instrumentation });
          await send("Page.reload", { ignoreCache: true });
          await sleep(1800);

          const expression = `(async () => {
            const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const views = Array.from(document.querySelectorAll('.nav-item[data-view]')).map((node) => node.getAttribute('data-view')).filter(Boolean);
            for (const view of views) {
              const node = document.querySelector('.nav-item[data-view="' + CSS.escape(view) + '"]');
              if (!node) continue;
              node.click();
              await wait(120);
            }
            await wait(600);
            return { views, stats: window.__livariantMutationObserverStats || null };
          })()`;
          const evaluated = await send("Runtime.evaluate", { expression, awaitPromise: true, returnByValue: true });
          if (evaluated.exceptionDetails) throw new Error(`Renderer profiling expression failed: ${JSON.stringify(evaluated.exceptionDetails)}`);
          const value = evaluated.result?.value;
          if (!value?.stats) throw new Error("MutationObserver profiling stats were not available after reload.");

          const normalize = (entry) => ({
            ...entry,
            totalMs: Number(entry.totalMs.toFixed(3)),
            maxMs: Number(entry.maxMs.toFixed(3)),
          });
          const evidence = {
            schemaVersion: 1,
            benchmark: "desktop-mutation-observer-navigation-profile",
            sourceSha: sourceSha.toLowerCase(),
            navigationCount: value.views.length,
            views: value.views,
            aggregate: normalize(value.stats),
            observers: value.stats.observers.map(normalize),
            interpretation: "Measurement-only WebView2 CDP profile. MutationObserver is wrapped before a reload of the installed Desktop, then each current primary navigation item is clicked once with settling intervals. Times are callback execution time only and are not full navigation latency or universal end-user claims."
          };
          delete evidence.aggregate.observers;
          await writeFile(outputPath, `${JSON.stringify(evidence, null, 2)}\n`, "utf8");
          socket.close();
          '@ | Set-Content -LiteralPath $profileScript -Encoding utf8

          $desktop = Start-Process -FilePath $env:LIVARIANT_BENCH_APP -PassThru
          try {
            node $profileScript "${{ github.event.pull_request.head.sha || github.sha }}" "desktop-mutation-observer-profile.json"
            if ($LASTEXITCODE -ne 0) { throw "MutationObserver profile helper failed with exit code $LASTEXITCODE." }
            $digest = (Get-FileHash -LiteralPath "desktop-mutation-observer-profile.json" -Algorithm SHA256).Hash.ToLowerInvariant()
            "sha256=$digest" | Set-Content -LiteralPath "desktop-mutation-observer-profile.sha256.txt" -Encoding utf8
            Write-Host "Desktop MutationObserver profile SHA-256: $digest"
          }
          finally {
            if ($desktop -and -not $desktop.HasExited) {
              Stop-Process -Id $desktop.Id -Force -ErrorAction SilentlyContinue
              $desktop.WaitForExit()
            }
            Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $env:LIVARIANT_BENCH_INSTALL_DIR -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Desktop startup idle and observer performance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-startup-idle-observer-baseline-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            desktop-startup-idle-baseline.json
            desktop-startup-idle-baseline.sha256.txt
            desktop-mutation-observer-profile.json
            desktop-mutation-observer-profile.sha256.txt
          if-no-files-found: error
