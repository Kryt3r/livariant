name: Rust Security Audit

on:
  push:
    branches:
      - main
    paths:
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/.cargo/audit.toml"
      - "security/rustsec-exceptions.json"
      - "scripts/check-rustsec-exceptions.mjs"
      - ".github/workflows/rust-security-audit.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/.cargo/audit.toml"
      - "security/rustsec-exceptions.json"
      - "scripts/check-rustsec-exceptions.mjs"
      - ".github/workflows/rust-security-audit.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: RustSec advisory audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify temporary RustSec exception boundary
        run: node scripts/check-rustsec-exceptions.mjs

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit desktop Rust dependency graph
        working-directory: apps/desktop/src-tauri
        run: cargo audit
